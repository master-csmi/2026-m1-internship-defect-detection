name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -e ".[notebook]"

      - name: Download test data (record 100 only)
        run: python -c "from m1_defect_anomaly_2026.data import download_mitbih; download_mitbih(records=['100'])"

      - name: Run tests
        run: pytest

      - name: Summary
        run: |
          echo "CI workflow completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Python version: 3.11" >> $GITHUB_STEP_SUMMARY
          echo "Dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
          echo "MIT-BIH data: record 100 downloaded successfully" >> $GITHUB_STEP_SUMMARY
          echo "Tests passed successfully" >> $GITHUB_STEP_SUMMARY
      