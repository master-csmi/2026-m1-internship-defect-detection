[project]
name = "m1-internship-defect-anomaly-2026"
version = "0.1.0"
description = "Starter repository for the 2026 M1 CSMI ECG anomaly detection project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "wfdb>=4.1.0",
    "matplotlib>=3.9.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pytest>=9.0.3",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "tabulate>=0.9.0
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]